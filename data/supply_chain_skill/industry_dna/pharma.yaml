customer_types:
  - 三级医院
  - 基层医疗机构
  - 药店连锁
  - 海外药企（CXO 客户）
  - 政府医保/集采
  - 体检机构
  - 患者终端
supplier_types:
  - 原料药供应商
  - 药用辅料与包材
  - 医疗器械零部件
  - 实验耗材与试剂
  - 上游设备（反应器/灌装线）
  - 物流冷链
demand_drivers:
  - 老龄化加速
  - 创新药出海
  - 集采常态化（量价博弈）
  - 国产替代（医疗器械）
  - GLP-1 类减重药爆发
  - ADC/双抗技术迭代
policy_catalysts:
  - 国家医保谈判
  - 集采政策
  - 创新药鼓励政策（医保谈判/优先审评）
  - DRG/DIP 支付改革
  - FDA 审评政策（出海）
  - 中医药传承发展

# P5-fix: 行业政策倾向（供个股六维详情·宏观与地缘 sector_policy 兜底）
# 取值约束: supportive | neutral | restrictive
# 医药行业整体受集采压制（量价博弈）→ restrictive
policy_lean: restrictive
policy_lean_rationale: 集采常态化压制仿制药价格，DRG/DIP 改革限制定价空间；创新药与出海受鼓励但占比有限，整体偏 restrictive
substitution_threats:
  - 仿制药替代原研（专利到期）
  - 生物类似药
  - 新型疗法（CGT/基因治疗）
  - 中成药替代（部分领域）
  - AI 辅助药物研发（降本增效）
time_window: long_term_12_36m
source: 国家药监局 2025 年报数据、米内网、上市医药企业 2025 年报
