  - 新能源车补贴/购置税减免
  - 储能政策（独立储能/容量电价）
  - 欧盟新电池法规
  - 美国 IRA 法案

# P5-fix: 行业政策倾向（供个股六维详情·宏观与地缘 sector_policy 兜底）
# 取值约束: supportive | neutral | restrictive
# 新能源电池：双碳目标 + 储能/电动车补贴 + IRA → supportive
policy_lean: supportive
policy_lean_rationale: 双碳战略 + 新能源车补贴延续 + 独立储能/容量电价政策直接利好动力/储能电池；海外 IRA 法案是机会也是壁垒
substitution_threats:
  - 钠离子电池（成本）
  - 固态电池（长期）
  - 氢燃料电池（商用车）
  - 超级电容（功率密度）
  - 新型化学体系（锂硫/锂空气）
time_window: mid_term_6_12m
source: 中国汽车动力电池产业创新联盟 2025 月度数据、起点研究院、上市电池企业 2025 年报
